
name: Release
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (major, minor, patch)"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  release:
    timeout-minutes: 120
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Capture pre-release commit SHA
        id: pre_release_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Install dependencies on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libbsd-dev uuid-dev

      - name: Cache cargo-release binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-release
          key: cargo-release-${{ runner.os }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Test with artifacts
        run: |
          cargo test --features static --workspace -- --nocapture
          git reset --hard HEAD
          git clean -fdx -e artifacts

      - name: Install cargo-release
        run: cargo install cargo-release || true

      - name: Run cargo-release for specified version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_HTTP_MULTIPLEXING: false
        run: |
          git config --global user.email "mohammed.imran@gsr.io"
          git config --global user.name "Mo Imran"
          release_type="${{ github.event.inputs.release_type }}"
          cargo release "$release_type" --workspace --execute --no-confirm --verbose --no-verify

      - name: Push new version and tag to GitHub
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          tags: false

      - name: Determine latest CI run ID
        id: find_ci
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Tie this to the exact commit that was merged (before the
            // cargo-release version-bump commit), and wait for *that*
            // commit's CI run to finish, instead of grabbing whatever
            // "latest success" run happens to exist. Picking any old
            // successful run is wrong: its artifacts may have expired
            // (short retention) and it may not even reflect this code.
            const sha = '${{ steps.pre_release_sha.outputs.sha }}';
            const maxAttempts = 40; // ~40 * 90s = 60 minutes of waiting
            const delayMs = 90000;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: sha,
                per_page: 5
              });

              if (runs.data.workflow_runs.length) {
                const run = runs.data.workflow_runs[0];
                console.log(`Attempt ${attempt}/${maxAttempts}: CI run ${run.id} for ${sha} status=${run.status} conclusion=${run.conclusion}`);

                if (run.status === 'completed') {
                  if (run.conclusion === 'success') {
                    core.setOutput('ci_run_id', run.id);
                    console.log(`✔ CI run ${run.id} succeeded for commit ${sha}`);
                    return;
                  }
                  core.setFailed(`CI run ${run.id} for commit ${sha} finished with conclusion "${run.conclusion}", not "success". Aborting release.`);
                  return;
                }
              } else {
                console.log(`Attempt ${attempt}/${maxAttempts}: no CI run found yet for commit ${sha}`);
              }

              await new Promise(r => setTimeout(r, delayMs));
            }

            core.setFailed(`Timed out after ~60 minutes waiting for the CI run of commit ${sha} to complete.`);

      - name: Download all artifacts via CLI loop
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN: ${{ steps.find_ci.outputs.ci_run_id }}
        run: |
          # define your list here:
          artifacts=(artifacts-macos-latest-static artifacts-ubuntu-22.04-static)

          for art in "${artifacts[@]}"; do
            echo "⏬ Downloading $art into artifacts/$art"
            gh run download "$CI_RUN" \
              --name "$art" \
              --dir "artifacts/$art"
          done
          find artifacts


      - name: Package artifacts
        shell: bash
        run: |
          # enable recursive globbing and skip missing
          shopt -s globstar nullglob
          for artifact_dir in artifacts/*; do
            [ -d "$artifact_dir" ] || continue
            archive="$artifact_dir.tar.gz"
            echo "📦 Creating archive $archive"
            tar -czf "$archive" -C artifacts "$(basename "$artifact_dir")"
          done

      - name: Extract version
        id: extract_version
        run: |
          version=$(grep '"rusteron-code-gen", version = ' Cargo.toml | sed -E 's/.*version = "=([^"]+)".*/\1/g')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "found $version"
      - uses: actions/create-release@v1
        id: create_release
        with:
          tag_name: v${{ steps.extract_version.outputs.version }}
          release_name: v${{ steps.extract_version.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for f in artifacts/*.tar.gz; do
            echo "⏫ Uploading $f"
            gh release upload "v${{ steps.extract_version.outputs.version }}" "$f"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check docker example builds
        run: |
          cd rusteron-docker-samples
          cargo update
          docker build -t aeron-media-driver aeron-media-driver
          docker build -t rusteron-dummy-example rusteron-dummy-example
