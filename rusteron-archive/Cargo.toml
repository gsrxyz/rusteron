[package]
name = "rusteron-archive"
version = "0.2.22"
edition = "2024"
authors = ["GSR devs <dev@gsr.io>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gsrxyz/rusteron"
homepage = "https://github.com/gsrxyz/rusteron"
readme = "README.md"
documentation = "https://gsrxyz.github.io/rusteron/rusteron_archive/index.html"
description = "Fast, idiomatic Rust client for Aeron transport and Aeron Archive recording, replay and replication, using the C API directly. Used in production for low-latency trading since early 2025."
keywords = ["aeron", "low-latency", "aeron-archive", "aeron-c-bindings", "networking"]
categories = ["network-programming"]

exclude = [
    "aeron/.gradle/**",
    "aeron/buildSrc/.gradle/**",
    "aeron/build/**",
    "aeron/aeron-agent/build/**",
    "aeron/aeron-all/build/**",
    "aeron/aeron-annotations/build/**",
    "aeron/aeron-archive/build/**",
    "aeron/aeron-client/build/**",
    "aeron/aeron-cluster/build/**",
    "aeron/aeron-driver/build/**",
    "aeron/aeron-samples/build/**",
    "aeron/aeron-system-tests/build/**",
    "aeron/aeron-test-support/build/**",
    "aeron/buildSrc/build/**"
]

[dependencies]
log     = { workspace = true }
regex   = { workspace = true }

[build-dependencies]
bindgen           = { workspace = true, optional = true }
cmake             = { workspace = true, optional = true }
dunce             = { workspace = true, optional = true }
flate2            = { workspace = true, optional = true }
log               = { workspace = true }
pkg-config        = { workspace = true }
proc-macro2       = { workspace = true, optional = true }
reqwest           = { workspace = true, optional = true }
rusteron-code-gen = { workspace = true }
tar               = { workspace = true, optional = true }
walkdir           = { workspace = true }

[dev-dependencies]
fd-lock     = { workspace = true }
rusteron-code-gen = { workspace = true }
rusteron-media-driver = { path = "../rusteron-media-driver" }
serial_test = { workspace = true }

[features]
# using static as different modules have different versions of aeron which don't seem to play nicely
default        = ["build-from-source"]
static         = ["build-from-source", "rusteron-media-driver/static"]   # Statically links the Aeron C code
backtrace      = []   # Logs the backtrace on each AeronCError
strict-lifecycle = ["rusteron-code-gen/strict-lifecycle"]   # Panic on Drop-time lifecycle leaks in tests
extra-logging  = []   # Logs when resources are created and destroyed
log-c-bindings = []   # Logs every C binding call with arguments and return values
precompile        = ["dep:reqwest", "dep:flate2", "dep:tar", "native-tls"]  # Uses precompiled C code instead of requiring cmake and java (defaults to native-tls)
precompile-rustls = ["dep:reqwest", "dep:flate2", "dep:tar", "rustls-tls"]  # Uses precompiled C code and rustls for downloads
native-tls        = ["reqwest?/native-tls"]   # Use native-tls for reqwest
rustls-tls        = ["reqwest?/rustls"]         # Use rustls instead of native-tls for reqwest
build-from-source = ["dep:bindgen", "dep:cmake", "dep:dunce", "dep:proc-macro2"]  # Builds Aeron C from source (requires cmake and a C++ compiler)
sanitize-address = ["build-from-source"]  # Compiles the Aeron C sources with -fsanitize=address (use with RUSTFLAGS="-Zsanitizer=address")

[package.metadata.docs.rs]
features        = ["static", "precompile"]
default-target  = "aarch64-apple-darwin"
