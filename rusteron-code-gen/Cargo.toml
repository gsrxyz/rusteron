[package]
name = "rusteron-code-gen"
version = "0.3.0"
edition = "2024"

authors = ["GSR devs <dev@gsr.io>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gsrxyz/rusteron"
homepage = "https://github.com/gsrxyz/rusteron"
readme = "README.md"
documentation = "https://gsrxyz.github.io/rusteron/rusteron_code_gen"
description = "Generates fast, idiomatic Rust wrappers and bindings for the Aeron C API."

[dependencies]
itertools     = { workspace = true }
log           = { workspace = true }
prettyplease  = { workspace = true }
proc-macro2   = { workspace = true }
quote         = { workspace = true }
regex         = { workspace = true }
syn           = { workspace = true }

[dev-dependencies]
fd-lock       = { workspace = true }
trybuild      = "1.0"

[features]
default        = []
static         = []
backtrace      = []     # logs the backtrace on each AeronCError
extra-logging  = []
strict-lifecycle = []   # Panic when an owned resource drops without close. Detects leaked C resources in tests.
